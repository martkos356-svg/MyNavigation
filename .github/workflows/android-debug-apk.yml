
name: Build MyNavigation APK

on:
  push:
    paths:
      - 'MyNavigation-upload.zip'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p unpacked
          unzip -q MyNavigation-upload.zip -d unpacked
          test -f unpacked/MyNavigation/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Kotlin and Java targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("unpacked/MyNavigation")
          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")

          compile_block = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{[^{}]*\}',
                  compile_block,
                  s,
                  count=1
              )
          else:
              s = re.sub(
                  r'(android\s*\{)',
                  r'\1\n' + compile_block,
                  s,
                  count=1
              )

          s = re.sub(
              r'\n\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              s,
              count=1
          )

          if not re.search(r'(?m)^\s*kotlin\s*\{', s):
              s += """

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          p.write_text(s, encoding="utf-8")
          print("Java 17 and Kotlin 17 configured")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: unpacked/MyNavigation
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNavigation-APK
          path: unpacked/MyNavigation/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
