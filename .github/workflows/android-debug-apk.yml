name: Build MyNavigation APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyNavigation-upload.zip'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -q MyNavigation-upload.zip -d unpacked

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: unpacked/MyNavigation
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNavigation-APK
          path: unpacked/MyNavigation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
