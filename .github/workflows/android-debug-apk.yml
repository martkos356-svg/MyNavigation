name: Build MyNavigation APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyNavigation-upload.zip'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q MyNavigation-upload.zip -d unpacked

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android compile targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("unpacked/MyNavigation")

          p = root / "build.gradle.kts"
          s = p.read_text()
          s = s.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.20"',
              'id("org.jetbrains.kotlin.android") version "2.3.0"'
          )
          p.write_text(s)

          p = root / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace("compileSdk = 35", "compileSdk = 36")

          config = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          """

          marker = "    defaultConfig {"
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, config + marker, 1)

          p.write_text(s)
          PY
