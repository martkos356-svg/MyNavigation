name: Build MyNavigation APK

on:
  push:
    paths:
      - 'MyNavigation-Android-project-fixed.zip'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: test -f MyNavigation-Android-project-fixed.zip

      - name: Extract Android project
        run: |
          unzip -q MyNavigation-Android-project-fixed.zip -d unpacked
          test -f unpacked/MyNavigation/settings.gradle.kts
          test -f unpacked/MyNavigation/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Java and Kotlin targets
        working-directory: unpacked/MyNavigation
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget = "17"' app/build.gradle.kts

      - name: Build APK
        working-directory: unpacked/MyNavigation
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mynavigation-debug-apk
          path: unpacked/MyNavigation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
